name: ProjectInfinity Build - Alioth

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ProjectInfinity for Mi 11X
    steps:

    - name: Set up build environment
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libwxgtk3.0-gtk3-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev openjdk-11-jdk
        
    - name: Initialize repo
      run: |
        mkdir infinity && cd infinity
        repo init -u https://github.com/ProjectInfinity-X/manifest.git -b thirteen --depth=1
        repo sync -c --no-tags --no-clone-bundle -j8

    - name: Clone device trees & kernel
      run: |
        cd infinity
        git clone https://github.com/ProjectInfinity-X/device_xiaomi_alioth.git -b thirteen device/xiaomi/alioth
        git clone https://github.com/ProjectInfinity-X/vendor_xiaomi_alioth.git -b thirteen vendor/xiaomi/alioth
        git clone https://github.com/ProjectInfinity-X/kernel_xiaomi_sm8250.git -b thirteen kernel/xiaomi/sm8250

    - name: Build ROM
      run: |
        cd infinity
        source build/envsetup.sh
        lunch aosp_alioth-userdebug
        mka bacon -j8

    - name: Upload ROM (Artifact)
      uses: actions/upload-artifact@v2
      with:
        name: infinity-rom
        path: infinity/out/target/product/alioth/*.zip
